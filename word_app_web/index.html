<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FFA500">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="单词软件">
  <title>单词软件</title>
  <link rel="manifest" href="manifest.json?v=20260610">
  <link rel="icon" href="pwa-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="pwa-icon.svg">
  <script>
    // 在 CSS 渲染前检查夜间模式偏好，防止闪烁
    if (localStorage.getItem('wordapp_nightMode') === 'true') {
      document.documentElement.classList.add('night-mode');
    }
  </script>
  <link rel="stylesheet" href="css/style.css?v=20260610">
</head>
<body>
  <script>
    // 将 html 上的夜间模式 class 同步到 body（防止闪烁）
    if (document.documentElement.classList.contains('night-mode')) {
      document.body.classList.add('night-mode');
    }
  </script>
  <div id="loading-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:999;transition:opacity 0.4s ease;">
    <div style="font-size:48px;margin-bottom:16px;">📖</div>
    <div style="font-size:18px;font-weight:600;color:var(--text);">单词软件</div>
    <div style="margin-top:12px;font-size:14px;color:var(--btn-gray);">加载中...</div>
  </div>
  <div id="app">
    <div class="app-bar">
      <h1 id="page-title">单词软件</h1>
    </div>
    <div id="toast" class="toast"></div>

    <!-- ========== 主内容区 ========== -->
    <div id="main-content">

      <!-- Tab 1: 学习 -->
      <div class="tab-content active" data-tab="study">
        <div class="card">
          <div class="card-title">学习概览</div>
          <div class="stat-row" onclick="showAllWords()" style="cursor:pointer;"><span class="stat-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span><span class="stat-label">总单词数</span><span class="stat-value" id="stat-total" style="color:#FFA500">0</span></div>
          <div class="stat-row" onclick="showDueWords()" style="cursor:pointer;"><span class="stat-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg></span><span class="stat-label">待复习</span><span class="stat-value" id="stat-due" style="color:#E74C3C">0</span></div>
          <div class="stat-row" onclick="showLearnedWords()" style="cursor:pointer;"><span class="stat-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span><span class="stat-label">已学习</span><span class="stat-value" id="stat-learned" style="color:#3498DB">0</span></div>
          <div class="stat-row" onclick="showMasteredWords()" style="cursor:pointer;"><span class="stat-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20,6 9,17 4,12"/></svg></span><span class="stat-label">已掌握</span><span class="stat-value" id="stat-mastered" style="color:#2ECC71">0</span></div>
        </div>
        <button class="btn btn-orange" onclick="startDailyStudy()" id="start-daily-btn" style="width:100%;margin-bottom:12px;display:none;">📅 开始今日学习</button>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <button class="btn btn-orange" onclick="startStudy('learn')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> 学习模式</button>
          <button class="btn btn-secondary" onclick="startStudy('spell')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;"><polyline points="16,3 21,3 21,8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21,16 21,21 16,21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg> 拼写模式</button>
          <button class="btn btn-secondary" onclick="startStudy('recall')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;"><path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5"/><path d="M8.5 8.5v.01"/><path d="M16 15.5v.01"/><path d="M12 12v.01"/><path d="M11 17v.01"/><path d="M7 14v.01"/></svg> 复习模式</button>
        </div>
        <div class="hint" id="home-hint"></div>
      </div>

      <!-- Tab 2: 词库 -->
      <div class="tab-content" data-tab="words">
        <!-- 词本列表视图 -->
        <div id="books-view">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <span style="font-size:15px;color:var(--btn-gray);" id="books-count">0 个词本</span>
            <button class="btn btn-orange btn-sm" onclick="showCreateBookDialog()">➕ 新建词本</button>
          </div>
          <input type="text" id="global-search-input" class="spell-input" style="margin-bottom:10px;text-align:left;font-size:14px;display:none;" placeholder="搜索所有词本中的单词..." oninput="onGlobalSearch()">
          <div id="global-search-results" style="display:none;"></div>
          <div id="books-list"></div>
        </div>
        <!-- 单词列表视图（点进词本后显示） -->
        <div id="words-view" style="display:none;flex-direction:column;max-height:calc(100vh - 130px);">
          <div style="flex-shrink:0;">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
              <button class="btn btn-gray btn-sm" onclick="showBooksView()" style="padding:0 12px;">← 返回</button>
              <span style="font-size:16px;font-weight:600;flex:1;" id="current-book-name">词本</span>
              <button class="btn btn-orange btn-sm" onclick="showImportDialog()">➕</button>
              <button class="btn btn-secondary btn-sm" onclick="handleDirectFileImport()">📁</button>
            </div>
            <div style="font-size:14px;color:var(--btn-gray);margin-bottom:8px;" id="word-count">共 0 个单词</div>
            <input type="text" id="word-search" class="spell-input" style="margin-bottom:8px;text-align:left;font-size:14px;display:none;" placeholder="搜索单词..." oninput="filterWordList()">
          </div>
          <div id="word-list" style="flex:1;overflow-y:auto;min-height:0;"></div>
          <input type="file" id="file-input" accept=".txt,.csv,.tsv,.json,.md,.xlsx" style="display:none">
          <div id="batch-actions" style="display:flex;gap:8px;margin-top:10px;">
            <button class="btn btn-outline btn-sm" onclick="toggleSelectAll()" style="flex:1;">全选</button>
            <button class="btn btn-outline btn-sm" onclick="batchDeleteSelected()" style="flex:1;color:var(--btn-red);border-color:var(--btn-red);">🗑️ 批量删除</button>
            <button class="btn btn-outline btn-sm" onclick="batchMoveSelected()" style="flex:1;">📂 移动到</button>
          </div>
          <div style="margin-top:8px;">
            <button class="btn btn-orange" style="width:100%;" onclick="startStudyFromSource('selected')">从勾选的单词开始复习</button>
          </div>
        </div>
      </div>

      <!-- Tab 3: 统计 -->
      <div class="tab-content" data-tab="stats">
        <div class="stats-tabs">
          <button class="stat-tab active" data-period="day" onclick="switchStatsTab('day')">今日</button>
          <button class="stat-tab" data-period="week" onclick="switchStatsTab('week')">本周</button>
          <button class="stat-tab" data-period="month" onclick="switchStatsTab('month')">本月</button>
          <button class="stat-tab" data-period="year" onclick="switchStatsTab('year')">今年</button>
          <button class="stat-tab" data-period="all" onclick="switchStatsTab('all')">总计</button>
        </div>
        <div id="stats-content"></div>
      </div>

      <!-- Tab 4: 我的 -->
      <div class="tab-content" data-tab="profile">
        <div class="card">
          <button class="settings-entry-btn" onclick="showSubPage('mistake')">
            <span class="entry-icon">❌</span> 错题本
            <span class="entry-arrow">→</span>
          </button>
          <button class="settings-entry-btn" onclick="showSubPage('favorite')" style="border-top:1px solid rgba(0,0,0,0.04);">
            <span class="entry-icon">⭐</span> 收藏本
            <span class="entry-arrow">→</span>
          </button>
        </div>
        <div class="card">
          <div class="card-title">⚙️ 设置</div>
          <div class="settings-item">
            <span>学习方向</span>
            <div class="seg-control" id="direction-control">
              <button class="seg-btn" data-value="front2back" onclick="setDirection('front2back')">正面→反面</button>
              <button class="seg-btn" data-value="back2front" onclick="setDirection('back2front')">反面→正面</button>
            </div>
          </div>
          <div class="settings-item">
            <span>记忆算法</span>
            <div class="seg-control" id="algorithm-control"></div>
          </div>
          <div id="custom-interval-area" style="display:none;margin-top:8px;margin-bottom:8px;">
            <p style="font-size:14px;color:var(--btn-gray);margin-bottom:8px;">自定义间隔（天），用逗号分隔：</p>
            <input type="text" id="custom-intervals" class="spell-input" value="1,3,5,10,20" style="text-align:left;" placeholder="1,2,4,7,15,30">
            <div id="interval-preview" style="font-size:13px;color:var(--btn-gray);margin:6px 0;"></div>
            <button class="btn btn-orange btn-sm" onclick="saveCustomIntervals()" style="margin-top:4px;width:100%;">保存</button>
          </div>
          <div class="settings-item">
            <span>每日目标（仅统计）</span>
            <input type="number" id="daily-goal-input" value="10" min="1" onchange="setDailyGoal(this.value)" style="width:70px;padding:6px 12px;border-radius:8px;border:1.5px solid rgba(149,165,166,0.2);font-size:14px;background:var(--card);color:var(--text);text-align:center;">
          </div>
          <div class="settings-item">
            <span>夜间模式</span>
            <label class="toggle-switch">
              <input type="checkbox" id="night-toggle" onchange="toggleNightMode()">
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
        <div class="card" style="text-align:center;">
          <p style="font-size:14px;color:var(--btn-gray);">单词软件 v1.0 · 纯本地存储</p>
          <div style="display:flex;gap:8px;margin-top:12px;justify-content:center;">
            <button class="btn btn-outline btn-sm" onclick="exportData()">📤 导出数据</button>
            <button class="btn btn-outline btn-sm" onclick="document.getElementById('import-backup-input').click()">📥 导入备份</button>
          </div>
          <input type="file" id="import-backup-input" accept=".json" style="display:none" onchange="importBackup(event)">
          <button class="btn-text" style="margin-top:12px;color:var(--btn-red);font-size:13px;" onclick="resetAllData()">🗑️ 清空所有数据</button>
        </div>
        <div class="card" style="text-align:center;">
          <div style="display:flex;gap:8px;justify-content:center;">
            <button class="btn btn-outline btn-sm" onclick="toggleFullscreen()">⛶ 全屏模式</button>
            <button class="btn btn-outline btn-sm" onclick="showInstallGuide()">📲 安装到主屏幕</button>
          </div>
          <div id="install-guide" style="display:none;margin-top:12px;padding:12px;background:var(--bg);border-radius:8px;font-size:13px;color:var(--btn-gray);text-align:left;line-height:1.6;"></div>
        </div>
      </div>
    </div>

    <!-- ========== 全屏页面（覆盖 Tab，有返回按钮） ========== -->
    <div id="fullscreen-pages">
      <!-- 学习页面 -->
      <div id="page-study" class="fullscreen-page">
        <div id="study-empty" class="hint" style="display:none;margin-top:80px;"></div>
        <div id="study-container">
          <div class="study-progress-wrap">
            <span class="study-progress-text" id="study-progress">0 / 0</span>
            <span class="study-progress-text" id="study-mode-label" style="opacity:0.6;">学习</span>
            <button class="word-pronounce-sm" onclick="speakCurrentWord()">🔊</button>
            <button class="study-exit-btn" onclick="goHome()">✕ 退出</button>
          </div>
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
          <div class="card" id="word-display">
            <div class="word-display"><div class="word-english" id="word-english">hello</div><div class="word-chinese" id="word-chinese">你好</div></div>
          </div>
          <div id="study-actions">
            <button class="btn btn-red" onclick="handleAction('0')"><span class="btn-label">忘记</span></button>
            <button class="btn btn-orange" onclick="handleAction('1')"><span class="btn-label">困难</span></button>
            <button class="btn btn-blue" onclick="handleAction('3')"><span class="btn-label">良好</span></button>
            <button class="btn btn-green" onclick="handleAction('4')"><span class="btn-label">简单</span></button>
          </div>
          <div id="spell-area" style="display:none;">
            <input type="text" id="spell-input" class="spell-input" placeholder="输入答案..." autocomplete="off">
          </div>
        </div>
      </div>

      <!-- 错题本 -->
      <div id="page-mistake" class="fullscreen-page">
        <div class="card">
          <div class="card-title">❌ 错题本</div>
          <div id="mistake-list" style="max-height:calc(100vh - 250px);overflow-y:auto;"></div>
          <button class="btn btn-orange" style="width:100%;margin-top:12px;" onclick="startStudyFromSource('mistake')">从错题本开始复习</button>
        </div>
      </div>

      <!-- 收藏本 -->
      <div id="page-favorite" class="fullscreen-page">
        <div class="card">
          <div class="card-title">⭐ 收藏本</div>
          <div id="favorite-list" style="max-height:calc(100vh - 250px);overflow-y:auto;"></div>
          <button class="btn btn-orange" style="width:100%;margin-top:12px;" onclick="startStudyFromSource('favorite')">从收藏本开始复习</button>
        </div>
      </div>

      <!-- 单词浏览页面（统计入口） -->
      <div id="page-wordsview" class="fullscreen-page">
        <div class="card">
          <div class="card-title" id="wordsview-title">单词列表</div>
          <div id="wordsview-list" style="max-height:calc(100vh - 200px);overflow-y:auto;"></div>
        </div>
      </div>
    </div>

    <!-- ========== 底部导航栏 ========== -->
    <div class="bottom-nav" id="bottom-nav">
      <button class="nav-item active" data-tab="study" onclick="switchTab('study')">
        <span class="nav-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="14" y2="11"/></svg></span>
        <span class="nav-label">学习</span>
      </button>
      <button class="nav-item" data-tab="words" onclick="switchTab('words')">
        <span class="nav-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span>
        <span class="nav-label">词库</span>
      </button>
      <button class="nav-item" data-tab="stats" onclick="switchTab('stats')">
        <span class="nav-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span>
        <span class="nav-label">统计</span>
      </button>
      <button class="nav-item" data-tab="profile" onclick="switchTab('profile')">
        <span class="nav-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
        <span class="nav-label">我的</span>
      </button>
    </div>
    </div>

    <!-- ========== 对话框（浮动） ========== -->
    <div id="import-dialog" class="dialog-overlay" style="display:none;">
      <div class="card" style="width:100%;max-width:440px;">
        <div class="card-title">导入单词</div>
        <div style="margin-bottom:12px;">
          <label style="font-size:14px;color:var(--btn-gray);display:block;margin-bottom:4px;">导入到词本</label>
          <select id="import-book-select" style="width:100%;padding:10px;border:2px solid var(--btn-gray);border-radius:8px;font-size:15px;background:var(--card);color:var(--text);"></select>
        </div>
        <p style="font-size:14px;color:var(--btn-gray);margin-bottom:12px;">每行一个单词，格式：<br><code>word, 释义</code> 或 <code>word 释义</code></p>
        <textarea id="import-text" style="width:100%;min-height:150px;padding:12px;border:2px solid var(--btn-gray);border-radius:8px;font-size:15px;background:var(--card);color:var(--text);resize:vertical;" placeholder="hello, 你好&#10;world, 世界&#10;apple 苹果"></textarea>
        <div class="btn-group" style="margin-top:12px;">
          <button class="btn btn-gray" onclick="closeImportDialog()">取消</button>
          <button class="btn btn-orange" onclick="handleImport()">导入</button>
        </div>
      </div>
    </div>

    <div id="detail-dialog" class="dialog-overlay" style="display:none;">
      <div class="card" style="width:100%;max-width:440px;max-height:90vh;overflow-y:auto;">
        <div class="card-title">📖 单词详情</div>
        <div style="text-align:center;margin-bottom:16px;">
          <div style="font-size:24px;font-weight:700;" id="detail-english"></div>
          <div style="font-size:18px;color:var(--btn-gray);margin-top:4px;" id="detail-chinese"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;">
          <div style="background:var(--bg);padding:10px;border-radius:8px;text-align:center;">
            <div style="font-size:12px;color:var(--btn-gray);">熟练度</div>
            <div style="font-size:18px;font-weight:700;" id="detail-proficiency">-</div>
          </div>
          <div style="background:var(--bg);padding:10px;border-radius:8px;text-align:center;">
            <div style="font-size:12px;color:var(--btn-gray);">复习次数</div>
            <div style="font-size:18px;font-weight:700;" id="detail-reviewed">-</div>
          </div>
          <div style="background:var(--bg);padding:10px;border-radius:8px;text-align:center;">
            <div style="font-size:12px;color:var(--btn-gray);">连续正确</div>
            <div style="font-size:18px;font-weight:700;" id="detail-consecutive">-</div>
          </div>
          <div style="background:var(--bg);padding:10px;border-radius:8px;text-align:center;">
            <div style="font-size:12px;color:var(--btn-gray);">正确率</div>
            <div style="font-size:18px;font-weight:700;" id="detail-correct-rate">-</div>
          </div>
          <div style="background:var(--bg);padding:10px;border-radius:8px;text-align:center;">
            <div style="font-size:12px;color:var(--btn-gray);">错误次数</div>
            <div style="font-size:18px;font-weight:700;" id="detail-forgot">-</div>
          </div>
        </div>
        <div style="font-size:14px;color:var(--btn-gray);margin-bottom:8px;">复习记录</div>
        <div id="detail-history" style="max-height:200px;overflow-y:auto;"></div>
        <button class="btn btn-gray" style="width:100%;margin-top:12px;" onclick="closeDetailDialog()">关闭</button>
      </div>
    </div>

    <div id="edit-dialog" class="dialog-overlay" style="display:none;">
      <div class="card" style="width:100%;max-width:440px;">
        <div class="card-title">✏️ 编辑单词</div>
        <div style="margin-bottom:12px;">
          <label style="font-size:14px;color:var(--btn-gray);display:block;margin-bottom:4px;">英文</label>
          <input id="edit-english" class="spell-input" style="text-align:left;" placeholder="英文单词">
        </div>
        <div style="margin-bottom:12px;">
          <label style="font-size:14px;color:var(--btn-gray);display:block;margin-bottom:4px;">中文</label>
          <input id="edit-chinese" class="spell-input" style="text-align:left;" placeholder="中文释义">
        </div>
        <div class="btn-group">
          <button class="btn btn-gray" onclick="closeEditDialog()">取消</button>
          <button class="btn btn-orange" onclick="saveEditWord()">保存</button>
        </div>
      </div>
    </div>

    <div id="create-book-dialog" class="dialog-overlay" style="display:none;">
      <div class="card" style="width:100%;max-width:380px;">
        <div class="card-title">📕 新建词本</div>
        <input id="new-book-name" class="spell-input" style="text-align:left;margin-bottom:12px;" placeholder="输入词本名称">
        <div class="btn-group" style="margin-top:12px;">
          <button class="btn btn-gray" onclick="closeCreateBookDialog()">取消</button>
          <button class="btn btn-orange" onclick="createBook()">创建</button>
        </div>
      </div>
    </div>

    <div id="column-map-dialog" class="dialog-overlay" style="display:none;">
      <div class="card" style="width:100%;max-width:460px;">
        <div class="card-title">📋 选择列映射</div>
        <p style="font-size:14px;color:var(--btn-gray);margin-bottom:12px;">请选择每列对应的字段</p>
        <div id="column-map-fields"></div>
        <div class="btn-group" style="margin-top:12px;">
          <button class="btn btn-gray" onclick="closeColumnMapDialog()">取消</button>
          <button class="btn btn-orange" onclick="confirmColumnMap()">确认导入</button>
        </div>
      </div>
    </div>

    <div id="review-dialog" class="dialog-overlay" style="display:none;">
      <div class="card" style="width:100%;max-width:440px;">
        <div class="card-title" id="review-dialog-title">选择复习模式</div>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <button class="btn btn-orange" onclick="startReview('recall')">🧠 复习模式</button>
          <div style="border-top:1px solid rgba(149,165,166,0.15);margin:4px 0;"></div>
          <button class="btn btn-secondary" onclick="startFreeReview()">📖 自由复习（不影响记忆曲线）</button>
        </div>
        <button class="btn btn-gray" style="width:100%;margin-top:12px;" onclick="closeReviewDialog()">取消</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script src="js/study.js?v=20260611"></script>
  <script src="js/words.js?v=20260611"></script>
  <script src="js/stats.js?v=20260611"></script>
  <script src="js/profile.js?v=20260611"></script>
  <script src="js/app.js?v=20260611"></script>
</body>
</html>
